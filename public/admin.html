<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Usage Monitor · Unspoof</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 2.5 3.4v4.2c0 3.4 2.3 6 5.5 6.9 3.2-.9 5.5-3.5 5.5-6.9V3.4L8 1.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m5.6 8 1.7 1.7 3.2-3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Usage monitor
      </a>
      <span class="updated" id="updated">Loading…</span>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode"><svg class="i-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.4A7 7 0 0 1 7.6 3.5a7 7 0 1 0 8.9 8.9Z"/></svg><svg class="i-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg></button>
    </div>
  </div>

  <main class="wrap admin">
    <form class="admin-login" id="login" hidden>
      <label for="admin-key">Admin key</label>
      <input id="admin-key" type="password" autocomplete="current-password" required>
      <button type="submit">Show stats</button>
    </form>
    <div class="alert" id="error" role="alert" hidden></div>

    <div class="tiles">
      <div class="card tile"><div class="label">Checks today</div><div class="value" id="t-checksToday">–</div></div>
      <div class="card tile"><div class="label">Visitors today</div><div class="value" id="t-visitorsToday">–</div></div>
      <div class="card tile"><div class="label">Total checks</div><div class="value" id="t-totalChecks">–</div></div>
      <div class="card tile"><div class="label">Unique visitors</div><div class="value" id="t-uniqueVisitors">–</div></div>
      <div class="card tile"><div class="label">Unique domains</div><div class="value" id="t-uniqueDomains">–</div></div>
    </div>

    <section class="card panel">
      <h2>Checks per day <span>last 30 days</span></h2>
      <div class="chart" id="chart" role="img" aria-label="Checks per day, last 30 days"></div>
      <div class="chart-axis"><span id="axis-start"></span><span id="axis-max"></span><span id="axis-end"></span></div>
    </section>

    <section class="card panel">
      <h2>Latest checks <span>newest first, up to 100</span></h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Time</th><th>Domain</th><th>Score</th><th>DMARC</th><th>Visitor</th><th>Referrer</th><th>User agent</th></tr></thead>
          <tbody id="rows"><tr><td colspan="7">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
